name: Cleanup superseded Smart Chip test artifact
on:
  push:
    branches:
      - feat/smart-chip-99-27-20261126

permissions:
  actions: write
  contents: read

jobs:
  cleanup-old-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact obsolete artifact and delete it
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          assert os.environ['GITHUB_REPOSITORY']=='rubytools-tw/ruby-smart-chip'
          artifact_id=15094861611
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/artifacts/'+str(artifact_id)
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'ruby-smart-chip-one-time-cleanup'}
          try:
              with urllib.request.urlopen(urllib.request.Request(base,headers=headers),timeout=15) as reply:
                  item=json.load(reply)
          except urllib.error.HTTPError as error:
              if error.code==404:
                  print('Artifact already absent; cleanup finished.')
                  raise SystemExit(0)
              raise
          assert item['id']==artifact_id, 'Wrong artifact ID'
          assert item['name']=='RUBY_Smart_Chip_99_27_Update_20261126', 'Unexpected artifact name'
          assert item.get('workflow_run',{}).get('id')==45772208990, 'Unexpected test run'
          req=urllib.request.Request(base,headers=headers,method='DELETE')
          with urllib.request.urlopen(req,timeout=15) as reply:
              assert reply.status==204, 'GitHub did not delete artifact'
          print('Deleted obsolete Actions artifact:',item['id'],item['name'])
          PY